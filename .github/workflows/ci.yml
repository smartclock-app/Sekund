name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: CI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

  build-linux:
    name: CI Build Linux
    needs: test
    uses: ./.github/workflows/_build-linux.yml
    secrets: inherit

  build-android:
    name: CI Build Android
    needs: test
    uses: ./.github/workflows/_build-android.yml
    secrets: inherit
