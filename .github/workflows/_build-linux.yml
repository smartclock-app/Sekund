name: Build Linux Reusable

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Upload artifacts to workflow"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: rust-target-rpi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-target-rpi-

      - name: Cache Docker image
        uses: actions/cache@v4
        id: docker-cache
        with:
          path: /tmp/docker-image.tar
          key: docker-image-tauri-rpi-1.0.0

      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-image.tar

      - name: Pull Docker image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker pull dannypeaky/tauri-build-rpi:1.0.0

      - name: Save Docker image to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save -o /tmp/docker-image.tar dannypeaky/tauri-build-rpi:1.0.0

      - name: Build AppImage
        # Builds will fail if secrets are missing (such as in PRs), so allow this and check for artifacts in the next step
        continue-on-error: ${{ inputs.upload-artifacts == 'false' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker run --rm \
            -e TAURI_SIGNING_PRIVATE_KEY \
            -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            -e SENTRY_AUTH_TOKEN \
            -v $(pwd):/app \
            -w /app dannypeaky/tauri-build-rpi:1.0.0

      - name: Validate AppImage was created
        if: inputs.upload-artifacts == 'false'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::AppImage build failed - no artifact found"
            exit 1
          fi
          echo "AppImage created: $APPIMAGE"

      - name: Upload AppImage
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
