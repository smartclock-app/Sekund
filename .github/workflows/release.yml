name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  sync-version:
    name: Sync Version
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Cargo.toml
        run: sed -i 's/^version = ".*"/version = "${{ needs.prepare.outputs.version }}"/' src-tauri/Cargo.toml

      - name: Commit and push version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ needs.prepare.outputs.version }}" || true
          git push origin main || true

  build-linux:
    needs: prepare
    uses: ./.github/workflows/_build-linux.yml
    with:
      upload-artifacts: true
    secrets: inherit

  build-android:
    needs: prepare
    uses: ./.github/workflows/_build-android.yml
    with:
      upload-artifacts: true
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  release:
    name: Create Release
    needs: [prepare, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Generate latest.json
        run: |
          cat > latest.json <<EOF
          {
            "version": "v${{ needs.prepare.outputs.version }}",
            "notes": "Release v${{ needs.prepare.outputs.version }}",
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "linux-aarch64": {
                "signature": "$(cat linux-artifacts/*.sig)",
                "url": "https://github.com/0x5045414b/Sekund/releases/download/v${{ needs.prepare.outputs.version }}/Sekund_${{ needs.prepare.outputs.version }}_aarch64.AppImage"
              },
              "android": {
                "signature": "N/A",
                "url": "https://github.com/0x5045414b/Sekund/releases/download/v${{ needs.prepare.outputs.version }}/Sekund_${{ needs.prepare.outputs.version }}_universal.apk"
              }
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Sekund v${{ needs.prepare.outputs.version }}
          files: |
            linux-artifacts/*.AppImage
            linux-artifacts/*.sig
            android-artifacts/*.apk
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
