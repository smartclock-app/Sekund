name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  sync-version:
    name: Sync Version
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Cargo.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.prepare.outputs.version }}"/' src-tauri/Cargo.toml

      - name: Commit and push version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ needs.prepare.outputs.version }}" || true
          git push origin main || true

  build-linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: rust-target-rpi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-target-rpi-

      - name: Cache Docker image
        uses: actions/cache@v4
        id: docker-cache
        with:
          path: /tmp/docker-image.tar
          key: docker-image-tauri-rpi-1.0.0

      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-image.tar

      - name: Pull Docker image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker pull dannypeaky/tauri-build-rpi:1.0.0

      - name: Save Docker image to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save -o /tmp/docker-image.tar dannypeaky/tauri-build-rpi:1.0.0

      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker run --rm \
            -e TAURI_SIGNING_PRIVATE_KEY \
            -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            -e SENTRY_AUTH_TOKEN \
            -v $(pwd):/app \
            -w /app dannypeaky/tauri-build-rpi:1.0.0

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig

  build-android:
    name: Build Android
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: rust-target-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-target-android-

      - name: Cache Docker image
        uses: actions/cache@v4
        id: docker-cache
        with:
          path: /tmp/docker-image.tar
          key: docker-image-tauri-android-1.0.0

      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-image.tar

      - name: Pull Docker image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker pull dannypeaky/tauri-build-android:1.0.0

      - name: Save Docker image to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save -o /tmp/docker-image.tar dannypeaky/tauri-build-android:1.0.0

      - name: Prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/keystore.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker run --rm \
            -e SENTRY_AUTH_TOKEN \
            -v $(pwd):/app \
            -w /app dannypeaky/tauri-build-android:1.0.0

      - name: Rename APK
        run: |
          sudo mv app-universal-release.apk Sekund_${{ needs.prepare.outputs.version }}_universal.apk
        working-directory: src-tauri/gen/android/app/build/outputs/apk/universal/release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  release:
    name: Create Release
    needs: [prepare, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Generate latest.json
        run: |
          cat > latest.json <<EOF
          {
            "version": "v${{ needs.prepare.outputs.version }}",
            "notes": "Release v${{ needs.prepare.outputs.version }}",
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "linux-aarch64": {
                "signature": "$(cat linux-artifacts/*.sig)",
                "url": "https://github.com/0x5045414b/Sekund/releases/download/v${{ needs.prepare.outputs.version }}/Sekund_${{ needs.prepare.outputs.version }}_aarch64.AppImage"
              },
              "android": {
                "signature": "N/A",
                "url": "https://github.com/0x5045414b/Sekund/releases/download/v${{ needs.prepare.outputs.version }}/Sekund_${{ needs.prepare.outputs.version }}_universal.apk"
              }
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Sekund v${{ needs.prepare.outputs.version }}
          files: |
            linux-artifacts/*.AppImage
            linux-artifacts/*.sig
            android-artifacts/*.apk
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
