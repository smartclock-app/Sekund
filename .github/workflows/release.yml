# Builds and publishes a release when a version tag (v1.2.0) is pushed. scripts/release.sh makes the tag.
#
# Release files: the Android APK and the Linux .deb for arm64 (Raspberry Pi) and amd64, plus the signed
# update.json that devices update from. The server goes to GitHub's container registry as a Docker image.
# macOS and Windows aren't released; build them locally (docs/desktop.md).
#
# Repository secrets it needs (docs/releasing.md):
#   UPDATE_SIGNING_KEY          PEM private key that signs update.json
#   ANDROID_KEYSTORE_BASE64     the release keystore (.jks), base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  # Stops early if the tag and gradle.properties disagree, or a secret is missing.
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^sekund\.version=//p' gradle.properties)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME but gradle.properties says $version. Use scripts/release.sh."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the secrets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in UPDATE_SIGNING_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The repository secret $name is missing (see docs/releasing.md)"
              missing=1
            fi
          done
          exit "$missing"
      - uses: ./.github/actions/prepare-build
      - name: Test
        run: ./gradlew check

  android:
    needs: check
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          update-signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SEKUND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEKUND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SEKUND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # app/androidApp/build.gradle.kts signs with the keystore named by SEKUND_KEYSTORE_FILE.
          export SEKUND_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$SEKUND_KEYSTORE_FILE"
          ./gradlew :app:androidApp:assembleRelease
          rm "$SEKUND_KEYSTORE_FILE"
          mkdir -p release
          cp app/androidApp/build/outputs/apk/release/androidApp-release.apk "release/sekund-$VERSION.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: release/
          if-no-files-found: error

  # jpackage only builds for the machine it runs on, so each CPU gets its own runner.
  # Ubuntu 24.04 gives the package the dependency names Raspberry Pi OS 13 (trixie) uses (docs/desktop.md).
  linux:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          update-signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Install the packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils
      - name: Build the .deb
        run: |
          ./gradlew :app:desktopApp:packageDeb
          mkdir -p release
          # jpackage names it sekund_<version>_<arch>.deb (possibly with a "-1" revision); use one fixed name.
          cp app/desktopApp/build/compose/binaries/main/deb/sekund_*.deb "release/sekund_${VERSION}_${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  # The server image, for amd64 and arm64. The server is plain JVM code, so it's built once and the image
  # (server/Dockerfile) only copies it in.
  server-image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
      - name: Build the server
        run: ./gradlew :server:installDist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase; metadata-action takes care of that.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sekund-server
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Signs update.json for the built files and publishes everything as a GitHub release. Devices find it
  # through releases/latest/download/update.json, so this must come last.
  publish:
    needs: [check, android, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true
      - name: Read the release notes
        run: |
          # actions/checkout doesn't keep the tag's message; fetch the tag itself to read it.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Make update.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/update-signing.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file"
          scripts/make-update-manifest.sh "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            release "$key_file" "$(cat "$RUNNER_TEMP/notes.md")"
          rm "$key_file"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Sekund $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
