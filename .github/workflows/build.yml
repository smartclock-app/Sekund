name: CI — Build & Release Smart Clock

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare (version & tag check)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      should_build: ${{ steps.set.outputs.should_build }}
      should_release: ${{ steps.set.outputs.should_release }}
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Determine version and tag state
        id: set
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          SHOULD_BUILD=false
          SHOULD_RELEASE=false

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            SHOULD_BUILD=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git fetch --tags origin
            if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              SHOULD_BUILD=true
              SHOULD_RELEASE=true
            fi
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

  build_linux:
    name: Build Linux (AppImage)
    needs: prepare
    runs-on: ubuntu-22.04-arm
    if: needs.prepare.outputs.should_build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Docker image
        uses: actions/cache@v4
        id: docker-cache
        with:
          path: /tmp/docker-image.tar
          key: docker-image-dannypeaky-tauri-build-rpi-1.0.0

      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-image.tar

      - name: Pull Build Docker Image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker pull dannypeaky/tauri-build-rpi:1.0.0

      - name: Save Docker image to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save -o /tmp/docker-image.tar dannypeaky/tauri-build-rpi:1.0.0

      - name: Build AppImage inside Docker
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          docker run --rm \
            -e TAURI_SIGNING_PRIVATE_KEY \
            -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            -v $(pwd):/app \
            -w /app dannypeaky/tauri-build-rpi:1.0.0

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig

  release:
    name: Create Tag & Release
    needs: [prepare, build_linux]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.prepare.outputs.version }}" -m "Release v${{ needs.prepare.outputs.version }}"
          git push origin "refs/tags/v${{ needs.prepare.outputs.version }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Smart Clock v${{ needs.prepare.outputs.version }}
          files: |
            appimage/*.AppImage
            appimage/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
