name: Build Smart Clock

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux-aarch64:
    name: Build Linux ARM64 (Raspberry Pi)
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        run: cargo tauri build --bundles deb,appimage

      - name: Rename and organize artifacts
        run: |
          mkdir -p release-artifacts

          # Get version from tag or use 'dev'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(echo $GITHUB_SHA | cut -c1-7)"
          fi

          echo "Version: $VERSION"

          cd src-tauri/target/release/bundle

          # Copy and rename DEB
          if [ -d "deb" ]; then
            for file in deb/*.deb; do
              if [ -f "$file" ]; then
                cp "$file" "$GITHUB_WORKSPACE/release-artifacts/smart-clock_${VERSION}_arm64.deb"
                echo "✓ Created: smart-clock_${VERSION}_arm64.deb"
              fi
            done
          fi

          # Copy and rename AppImage
          if [ -d "appimage" ]; then
            for file in appimage/*.AppImage; do
              if [ -f "$file" ]; then
                cp "$file" "$GITHUB_WORKSPACE/release-artifacts/smart-clock_${VERSION}_aarch64.AppImage"
                chmod +x "$GITHUB_WORKSPACE/release-artifacts/smart-clock_${VERSION}_aarch64.AppImage"
                echo "✓ Created: smart-clock_${VERSION}_aarch64.AppImage"
              fi
            done
          fi

          # List created artifacts
          echo ""
          echo "Created artifacts:"
          ls -lh "$GITHUB_WORKSPACE/release-artifacts/"

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Initialize Tauri Android project
        run: cargo tauri android init

      - name: Setup signing for release builds
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        run: |
          echo "=========================================="
          echo "Setting up Android signing"
          echo "=========================================="

          # Decode keystore from base64
          echo "Decoding keystore from GitHub secret..."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/upload-keystore.jks

          # Verify keystore exists and has content
          if [ ! -f /tmp/upload-keystore.jks ]; then
            echo "ERROR: Keystore file was not created!"
            exit 1
          fi

          KEYSTORE_SIZE=$(stat -c%s /tmp/upload-keystore.jks)
          echo "Keystore file size: $KEYSTORE_SIZE bytes"

          if [ "$KEYSTORE_SIZE" -eq 0 ]; then
            echo "ERROR: Keystore file is empty!"
            exit 1
          fi

          # Create keystore.properties
          echo "Creating keystore.properties..."
          cat > src-tauri/gen/android/keystore.properties << 'EOF'
          storeFile=/tmp/upload-keystore.jks
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

          echo "✓ Keystore configured successfully"
          echo "=========================================="

      - name: Build Android APK (Debug - for PRs)
        if: github.event_name == 'pull_request'
        run: |
          echo "=========================================="
          echo "Building DEBUG APK (unsigned)"
          echo "=========================================="
          cargo tauri android build --apk
          echo "✓ Debug APK build complete"

      - name: Build Android APK (Release - signed)
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        run: |
          echo "=========================================="
          echo "Building RELEASE APK (signed)"
          echo "=========================================="
          cargo tauri android build --apk
          echo "✓ Release APK build complete"

      - name: Rename and organize APK artifacts
        run: |
          mkdir -p release-artifacts

          # Determine build type
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BUILD_TYPE="debug"
          else
            BUILD_TYPE="release"
          fi

          # Get version from tag or use 'dev'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(echo $GITHUB_SHA | cut -c1-7)"
          fi

          echo "Build type: $BUILD_TYPE"
          echo "Version: $VERSION"

          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"

          # Universal APK
          if [ -f "$APK_DIR/universal/$BUILD_TYPE/app-universal-$BUILD_TYPE.apk" ]; then
            cp "$APK_DIR/universal/$BUILD_TYPE/app-universal-$BUILD_TYPE.apk" \
               "release-artifacts/smart-clock_${VERSION}_universal_${BUILD_TYPE}.apk"
            echo "✓ Created: smart-clock_${VERSION}_universal_${BUILD_TYPE}.apk"
          fi

          # Architecture-specific APKs
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -f "$APK_DIR/$arch/$BUILD_TYPE/app-$arch-$BUILD_TYPE.apk" ]; then
              cp "$APK_DIR/$arch/$BUILD_TYPE/app-$arch-$BUILD_TYPE.apk" \
                 "release-artifacts/smart-clock_${VERSION}_${arch}_${BUILD_TYPE}.apk"
              echo "✓ Created: smart-clock_${VERSION}_${arch}_${BUILD_TYPE}.apk"
            fi
          done

          # List created artifacts
          echo ""
          echo "Created artifacts:"
          ls -lh release-artifacts/

      - name: Verify APK signature (Release only)
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        run: |
          echo "=========================================="
          echo "Verifying APK signatures"
          echo "=========================================="

          # Find build tools version
          BUILD_TOOLS=$(ls -1 $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          echo ""

          VERIFICATION_FAILED=0

          for apk in release-artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "------------------------------------------"
              echo "Verifying: $(basename $apk)"
              echo "------------------------------------------"
              
              if $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner verify --verbose "$apk"; then
                echo "✓ APK signature is VALID"
                echo ""
                echo "Certificate details:"
                $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner verify --print-certs "$apk" | head -20
              else
                echo "✗ APK signature verification FAILED for $(basename $apk)"
                VERIFICATION_FAILED=1
              fi
              echo ""
            fi
          done

          if [ $VERIFICATION_FAILED -eq 1 ]; then
            echo "=========================================="
            echo "ERROR: One or more APK signatures failed verification"
            echo "=========================================="
            exit 1
          fi

          echo "=========================================="
          echo "✓ All APK signatures verified successfully"
          echo "=========================================="

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: |
          echo "Cleaning up sensitive files..."
          rm -f /tmp/upload-keystore.jks
          rm -f src-tauri/gen/android/keystore.properties
          echo "✓ Cleanup complete"

  create-release:
    name: Create GitHub Release
    needs: [build-linux-aarch64, build-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: |
          echo "Downloaded artifacts:"
          ls -R artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.apk" \) -exec sha256sum {} \; | tee SHA256SUMS.txt

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
          body: |
            ## 📦 Smart Clock ${{ steps.version.outputs.version }}

            ### Downloads

            **Raspberry Pi (ARM64 Linux):**
            - `.deb` - Debian/Ubuntu/Raspberry Pi OS package
            - `.AppImage` - Universal Linux package (works on any distro)

            **Android:**
            - `universal` - Works on all Android devices (recommended)
            - Architecture-specific APKs for smaller downloads

            ### 🔧 Installation

            **Raspberry Pi:**
            ```bash
            # Install DEB package
            sudo dpkg -i smart-clock_${{ steps.version.outputs.version }}_arm64.deb
            sudo apt-get install -f  # Install dependencies

            # Or use AppImage (no installation needed)
            chmod +x smart-clock_${{ steps.version.outputs.version }}_aarch64.AppImage
            ./smart-clock_${{ steps.version.outputs.version }}_aarch64.AppImage
            ```

            **Android:**
            1. Download the universal APK
            2. Enable "Install from Unknown Sources" in Settings → Security
            3. Open the downloaded APK to install

            ### 🔐 Security

            All APKs are signed with the official release key. Verify checksums using `SHA256SUMS.txt`.

            ### 📋 Checksums

            See `SHA256SUMS.txt` in the release assets for file verification.
          files: |
            artifacts/linux-aarch64/*
            artifacts/android-apk/*
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-summary:
    name: Build Summary
    needs: [build-linux-aarch64, build-android]
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Runner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux ARM64 (Raspberry Pi) | ubuntu-22.04-arm | ${{ needs.build-linux-aarch64.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android APK | ubuntu-22.04 (x86_64) | ${{ needs.build-android.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build-linux-aarch64.result }}" == "success" && "${{ needs.build-android.result }}" == "success" ]]; then
            echo "### 🎉 All builds succeeded!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Some builds failed. Check the logs above." >> $GITHUB_STEP_SUMMARY
          fi
