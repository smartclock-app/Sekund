name: Build Smart Clock

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux-aarch64:
    name: Build Linux ARM64 (Raspberry Pi)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-aarch64-

      - name: Install ARM64 cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Tauri dependencies (ARM64)
        run: |
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/arm64.list << EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates universe
          EOF

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev:arm64 \
            libssl-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            libglib2.0-dev:arm64 \
            libgtk-3-dev:arm64 \
            libsoup-3.0-dev:arm64 || true

          # Fallback to host architecture dependencies for building
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Tauri CLI
        run: bun install --global @tauri-apps/cli@next

      - name: Setup cargo config for cross-compilation
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"

          [env]
          PKG_CONFIG_SYSROOT_DIR = "/usr/aarch64-linux-gnu"
          EOF

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app for ARM64
        run: bun tauri build --target aarch64-unknown-linux-gnu
        env:
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Rename and organize artifacts
        run: |
          mkdir -p release-artifacts

          # Get version from tag or use 'dev'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(echo $GITHUB_SHA | cut -c1-7)"
          fi

          cd src-tauri/target/aarch64-unknown-linux-gnu/release/bundle

          # Copy and rename DEB
          if [ -d "deb" ]; then
            for file in deb/*.deb; do
              if [ -f "$file" ]; then
                cp "$file" "$GITHUB_WORKSPACE/release-artifacts/smart-clock_${VERSION}_arm64.deb"
                echo "✓ Created: smart-clock_${VERSION}_arm64.deb"
              fi
            done
          fi

          # Copy and rename AppImage
          if [ -d "appimage" ]; then
            for file in appimage/*.AppImage; do
              if [ -f "$file" ]; then
                cp "$file" "$GITHUB_WORKSPACE/release-artifacts/smart-clock_${VERSION}_aarch64.AppImage"
                chmod +x "$GITHUB_WORKSPACE/release-artifacts/smart-clock_${VERSION}_aarch64.AppImage"
                echo "✓ Created: smart-clock_${VERSION}_aarch64.AppImage"
              fi
            done
          fi

          # List created artifacts
          echo ""
          echo "Created artifacts:"
          ls -lh "$GITHUB_WORKSPACE/release-artifacts/"

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: release-artifacts/*
          if-no-files-found: warn
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install Tauri CLI
        run: bun install --global @tauri-apps/cli@next

      - name: Initialize Tauri Android project
        run: bun tauri android init

      - name: Decode and configure keystore (Release builds only)
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        run: |
          echo "Decoding keystore..."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $HOME/upload-keystore.jks

          echo "Creating keystore.properties..."
          cat > src-tauri/gen/android/keystore.properties << 'EOF'
          storeFile=$HOME/upload-keystore.jks
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

          echo "✓ Keystore configured successfully"

      - name: Build Android APK (Debug - for PRs)
        if: github.event_name == 'pull_request'
        run: |
          echo "Building debug APK..."
          bun tauri android build --apk

      - name: Build Android APK (Release - signed)
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        run: |
          echo "Building release APK (signed)..."
          bun tauri android build --apk

      - name: Rename and organize APK artifacts
        run: |
          mkdir -p release-artifacts

          # Determine build type
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BUILD_TYPE="debug"
          else
            BUILD_TYPE="release"
          fi

          # Get version from tag or use 'dev'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(echo $GITHUB_SHA | cut -c1-7)"
          fi

          echo "Build type: $BUILD_TYPE"
          echo "Version: $VERSION"

          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"

          # Universal APK
          if [ -f "$APK_DIR/universal/$BUILD_TYPE/app-universal-$BUILD_TYPE.apk" ]; then
            cp "$APK_DIR/universal/$BUILD_TYPE/app-universal-$BUILD_TYPE.apk" \
               "release-artifacts/smart-clock_${VERSION}_universal_${BUILD_TYPE}.apk"
            echo "✓ Created: smart-clock_${VERSION}_universal_${BUILD_TYPE}.apk"
          fi

          # Architecture-specific APKs
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -f "$APK_DIR/$arch/$BUILD_TYPE/app-$arch-$BUILD_TYPE.apk" ]; then
              cp "$APK_DIR/$arch/$BUILD_TYPE/app-$arch-$BUILD_TYPE.apk" \
                 "release-artifacts/smart-clock_${VERSION}_${arch}_${BUILD_TYPE}.apk"
              echo "✓ Created: smart-clock_${VERSION}_${arch}_${BUILD_TYPE}.apk"
            fi
          done

          # List created artifacts
          echo ""
          echo "Created artifacts:"
          ls -lh release-artifacts/

      - name: Verify APK signature (Release only)
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        run: |
          # Find build tools version
          BUILD_TOOLS=$(ls -1 $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          echo ""

          for apk in release-artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "=========================================="
              echo "Verifying: $(basename $apk)"
              echo "=========================================="
              
              if $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner verify --verbose "$apk"; then
                echo "✓ APK signature is valid"
                echo ""
                echo "Certificate details:"
                $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner verify --print-certs "$apk" | head -20
              else
                echo "✗ APK signature verification FAILED"
                exit 1
              fi
              echo ""
            fi
          done

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: |
          rm -f $HOME/upload-keystore.jks
          rm -f src-tauri/gen/android/keystore.properties

  create-release:
    name: Create GitHub Release
    needs: [build-linux-aarch64, build-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: |
          echo "Downloaded artifacts:"
          ls -R artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.apk" \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Try to extract release notes from CHANGELOG or create default
          if [ -f CHANGELOG.md ]; then
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '1d;$d' >> $GITHUB_OUTPUT || echo "Release $VERSION" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=Release $VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
          body: |
            ## Smart Clock ${{ steps.release_notes.outputs.version }}

            ### 📦 Downloads

            **Raspberry Pi (ARM64):**
            - `.deb` package for Debian/Ubuntu-based systems
            - `.AppImage` for any Linux distribution

            **Android:**
            - `universal` APK works on all architectures
            - Architecture-specific APKs for smaller download sizes

            ### 🔐 Installation

            **Raspberry Pi:**
            ```bash
            # Debian/Ubuntu
            sudo dpkg -i smart-clock_${{ steps.release_notes.outputs.version }}_arm64.deb
            sudo apt-get install -f  # Fix dependencies

            # Or use AppImage
            chmod +x smart-clock_${{ steps.release_notes.outputs.version }}_aarch64.AppImage
            ./smart-clock_${{ steps.release_notes.outputs.version }}_aarch64.AppImage
            ```

            **Android:**
            1. Download the universal APK or your device's architecture-specific APK
            2. Enable "Install from Unknown Sources" in Settings
            3. Open the APK file to install

            ### 📋 Checksums
            See `SHA256SUMS.txt` for file verification.

            ---

            ${{ steps.release_notes.outputs.notes }}
          files: |
            artifacts/linux-aarch64/*
            artifacts/android-apk/*
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build summary
  build-summary:
    name: Build Summary
    needs: [build-linux-aarch64, build-android]
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux ARM64 | ${{ needs.build-linux-aarch64.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android APK | ${{ needs.build-android.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
